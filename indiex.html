<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Prank 💘</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg,#ff758c,#ff7eb3);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }
  .container {
    text-align: center;
    position: relative;
  }
  h1 {
    color: white;
    margin-bottom: 40px;
  }
  .buttons {
    display: flex;
    gap: 30px;
    justify-content: center;
    position: relative;
  }
  button {
    padding: 15px 35px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    position: relative;
  }
  #yesBtn { background: #2ecc71; color: white; }
  #noBtn { background: #e74c3c; color: white; }
  .celebrate {
    display: none;
    font-size: 40px;
    color: white;
    animation: pop 0.6s ease-in-out infinite alternate;
    margin-top: 20px;
  }
  @keyframes pop {
    from { transform: scale(1); }
    to { transform: scale(1.1); }
  }
  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    animation: fall 3s linear infinite;
  }
  @keyframes fall {
    0% { transform: translateY(-100vh) rotate(0); }
    100% { transform: translateY(100vh) rotate(360deg); }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Will you be my Valentine? 💘</h1>
  <div class="buttons">
    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 😜</button>
  </div>
  <div class="celebrate" id="celebrate">Yeaaa! 🎉💖</div>
</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const celebrate = document.getElementById("celebrate");

// YES button moves endlessly, never clickable
function moveYes() {
  const x = Math.random() * (window.innerWidth - yesBtn.offsetWidth);
  const y = Math.random() * (window.innerHeight - yesBtn.offsetHeight);
  yesBtn.style.position = "absolute";
  yesBtn.style.left = x + "px";
  yesBtn.style.top = y + "px";
}

// Trigger movement endlessly
yesBtn.addEventListener("mouseenter", moveYes);
yesBtn.addEventListener("touchstart", moveYes);

// Ignore clicks completely
yesBtn.addEventListener("click", (e) => e.preventDefault());

// NO button click shows message and confetti
noBtn.addEventListener("click", () => {
  celebrate.style.display = "block";
  createConfetti();
});

// Confetti effect
function createConfetti() {
  for (let i = 0; i < 50; i++) {
    const confetti = document.createElement("div");
    confetti.classList.add("confetti");
    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.background = `hsl(${Math.random() * 360},100%,50%)`;
    confetti.style.animationDuration = (Math.random() * 2 + 2) + "s";
    document.body.appendChild(confetti);
    setTimeout(() => confetti.remove(), 4000);
  }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 😈</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg,#ff758c,#ff7eb3);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  .container {
    text-align: center;
    position: relative;
  }

  h1 {
    color: white;
    margin-bottom: 40px;
  }

  .buttons {
    display: flex;
    gap: 30px;
    justify-content: center;
    position: relative;
  }

  button {
    padding: 15px 35px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    position: relative;
  }

  #yesBtn {
    background: #2ecc71;
    color: white;
  }

  #noBtn {
    background: #e74c3c;
    color: white;
  }

  #message {
    display: none;
    font-size: 28px;
    color: white;
    margin-top: 25px;
    animation: sadPulse 1s infinite alternate;
  }

  @keyframes sadPulse {
    from { transform: scale(1); opacity: 0.8; }
    to { transform: scale(1.05); opacity: 1; }
  }

  .confetti {
    position: fixed;
    width: 8px;
    height: 8px;
    background: gray;
    animation: fall 3.5s linear infinite;
    opacity: 0.7;
  }

  @keyframes fall {
    0% { transform: translateY(-100vh) rotate(0deg); }
    100% { transform: translateY(100vh) rotate(360deg); }
  }
</style>
</head>

<body>

<div class="container">
  <h1>Will you be my Valentine? 💘</h1>

  <div class="buttons">
    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 😶</button>
  </div>

  <div id="message">This is good for your family 🥺</div>
</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const message = document.getElementById("message");

let moveCount = 0;
const MAX_MOVES = 100;

// YES button runs only 100 times
function moveYes() {
  if (moveCount >= MAX_MOVES) return;

  moveCount++;

  const x = Math.random() * (window.innerWidth - yesBtn.offsetWidth);
  const y = Math.random() * (window.innerHeight - yesBtn.offsetHeight);

  yesBtn.style.position = "absolute";
  yesBtn.style.left = x + "px";
  yesBtn.style.top = y + "px";
}

// Trigger run
yesBtn.addEventListener("mouseenter", moveYes);
yesBtn.addEventListener("touchstart", moveYes);
yesBtn.addEventListener("click", (e) => {
  e.preventDefault();
  moveYes();
});

// NO button → sad message + sad fireworks
noBtn.addEventListener("click", () => {
  message.style.display = "block";
  sadFireworks();
});

// Sad fireworks
function sadFireworks() {
  for (let i = 0; i < 40; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = `hsl(0, 0%, ${30 + Math.random() * 40}%)`; // gray shades
    c.style.animationDuration = (Math.random() * 2 + 2) + "s";
    document.body.appendChild(c);

    setTimeout(() => c.remove(), 4000);
  }
}
</script>

</body>
</html>
